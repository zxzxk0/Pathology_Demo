name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 현재는 정적 파일만 있으므로 별도 빌드 없음
      # Flask 서버가 필요한 경우 Render.com 등 별도 배포 필요
      - name: Verify structure
        run: |
          echo "=== Project Structure ==="
          find . -type f -not -path './.git/*' | sort
          echo "=== Tile data check ==="
          if [ -d "data/tiles" ] && [ "$(ls -A data/tiles 2>/dev/null | grep -v .gitkeep)" ]; then
            echo "✅ Tile data found"
          else
            echo "⚠️  No tile data — add tiles to data/tiles/ before deploying"
          fi
